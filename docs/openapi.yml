openapi: 3.0.3
info:
  title: Hunar API
  version: 1.0.0
  description: 'Hunar: practice, feedback, and trainer review for vocational skills'
paths:
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      summary: Sign in and obtain JWT access and refresh tokens
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: JWT token pair and user profile
        '400':
          description: Invalid credentials or deactivated account
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      summary: Blacklist refresh token on logout
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Logout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Logout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Logout'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Token blacklisted successfully
        '400':
          description: Invalid or expired token
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      summary: Get currently authenticated user profile
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      summary: Register a new learner account
      tags:
      - auth
      requestBody:
        content:
          application/json:
