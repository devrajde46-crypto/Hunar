components:
  schemas:
    DifficultyEnum:
      enum:
      - BEGINNER
      - INTERMEDIATE
      - ADVANCED
      type: string
      description: |-
        * `BEGINNER` - Beginner
        * `INTERMEDIATE` - Intermediate
        * `ADVANCED` - Advanced
    InstitutionSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        code:
          type: string
          maxLength: 50
      required:
      - code
      - id
      - name
    Login:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    Logout:
      type: object
      properties:
        refresh:
          type: string
      required:
      - refresh
    Module:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        trade:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
        sequence_order:
          type: integer
          maximum: 2147483647
          minimum: 0
          default: 1
        description:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - title
      - trade
    PaginatedModuleList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Module'
    PaginatedProcedureListList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/ProcedureList'
    PaginatedProcedureStepList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/ProcedureStep'
    PaginatedTradeList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Trade'
    PatchedModule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        trade:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
        sequence_order:
          type: integer
          maximum: 2147483647
          minimum: 0
          default: 1
        description:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
    PatchedProcedureDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        procedure_code:
          type: string
          maxLength: 50
        title:
          type: string
          maxLength: 255
        module:
          type: string
          format: uuid
        difficulty:
          $ref: '#/components/schemas/DifficultyEnum'
        estimated_duration_minutes:
          type: integer
          maximum: 2147483647
          minimum: 0
        description:
          type: string
        safety_instructions:
          type: string
        required_tools: {}
        is_active:
          type: boolean
        steps:
          type: array
          items:
            $ref: '#/components/schemas/ProcedureStep'
