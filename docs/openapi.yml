  /api/v1/practice/submissions/:
    get:
      operationId: practice_submissions_list
      description: List submissions scoped by user role (learners see own, trainers/admins
        see institution's). Soft-deleted submissions are omitted.
      summary: List Practice Submissions
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Practice Submissions
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPracticeSubmissionListList'
          description: ''
    post:
      operationId: practice_submissions_create
      description: Upload a practice recording for automated evaluation. Requires
        active consent, LEARNER role, valid .mp4 or .mov container, and size under
        HUNAR_MAX_UPLOAD_MB.
      summary: Upload Practice Video Submission
      tags:
      - Practice Submissions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PracticeSubmissionUpload'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PracticeSubmissionUpload'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PracticeSubmissionUpload'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticeSubmission'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/practice/submissions/{id}/:
    get:
      operationId: practice_submissions_retrieve
      description: Retrieve submission metadata. Scoped to the learner owner or authorized
        trainers/admins from the same institution. Never exposes filesystem paths.
      summary: Get Practice Submission Details
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Practice Submission.
        required: true
      tags:
      - Practice Submissions
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticeSubmission'
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    delete:
      operationId: practice_submissions_destroy
      description: Soft-delete a submission and remove its video file from storage.
        Only the learner owner can delete.
      summary: Delete Practice Submission
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Practice Submission.
        required: true
      tags:
      - Practice Submissions
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/practice/submissions/{id}/video/:
    get:
      operationId: practice_submissions_video_retrieve
      description: Stream video with HTTP Range request support for seeking. Scoped
        to the learner owner or authorized institutional trainers/admins.
      summary: Secure Video Playback Stream
      parameters:
      - in: header
        name: Range
        schema:
          type: string
        description: Standard HTTP Range header (e.g. 'bytes=0-1048575')
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Practice Submission.
        required: true
      tags:
      - Practice Submissions
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            video/mp4:
              schema:
                type: string
                format: binary
          description: ''
        '206':
          content:
            video/mp4:
              schema:
                type: string
                format: binary
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
components:
  schemas:
    DifficultyEnum:
      enum:
      - BEGINNER
      - INTERMEDIATE
      - ADVANCED
      type: string
      description: |-
        * `BEGINNER` - Beginner
        * `INTERMEDIATE` - Intermediate
        * `ADVANCED` - Advanced
    InstitutionSummary:
      type: object
      properties:
        id:
          type: string
